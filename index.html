<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Форма обратной связи</title>
</head>
<body>
  <h1 id="title">Обратная связь</h1>
  <form id="feedback-form">
    <label for="name">Имя:</label>
    <input type="text" id="name" placeholder="Введите имя" required>

    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="Введите email" required>

    <label for="message">Сообщение:</label>
    <textarea id="message" placeholder="Введите сообщение" required></textarea>

    <button type="submit" id="submit-btn">Отправить сообщение</button>
  </form>
  <p id="success-msg" style="display:none;">Форма отправлена!</p>

  <script>
    document.getElementById('feedback-form').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('success-msg').style.display = 'block';
    });
  </script>
</body>
</html>
